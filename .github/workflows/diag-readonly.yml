# WHY: pin the runner/toolchain so unattended runs cannot drift.
# Read-only staging diagnostics. No D1 writes, no engine run, no provider
# calls, no Telegram. Used to inspect the live staging D1 contents and the
# staging Worker's deployed version without risking any state change.
name: "🧪 STAGING — diag-readonly"

on:
  workflow_dispatch:
    inputs:
      pick_date:
        description: "pick_date to inspect (YYYY-MM-DD)"
        required: true

env:
  STAGING_DB_NAME: sureodds_staging

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Staging target guard (never production)
        run: |
          set -euo pipefail
          grep -q 'database_name = "sureodds_staging"' workers/wrangler.staging.toml
      - name: Worker deployment history (staging)
        run: |
          set -euo pipefail
          cd workers
          npx -y wrangler@4.151.1 deployments list --config wrangler.staging.toml || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: picks row count for the date
        run: |
          set -euo pipefail
          cd workers
          npx -y wrangler@4.151.1 d1 execute "$STAGING_DB_NAME" --remote \
            --config wrangler.staging.toml --json \
            --command "SELECT COUNT(*) AS n FROM picks WHERE pick_date='${{ inputs.pick_date }}'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: prediction_memberships breakdown for the date
        run: |
          set -euo pipefail
          cd workers
          npx -y wrangler@4.151.1 d1 execute "$STAGING_DB_NAME" --remote \
            --config wrangler.staging.toml --json \
            --command "SELECT m.collection, COUNT(*) AS n FROM prediction_memberships m JOIN picks p ON p.id = m.prediction_id WHERE p.pick_date='${{ inputs.pick_date }}' GROUP BY m.collection"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: top and daily pick ids for the date
        run: |
          set -euo pipefail
          cd workers
          npx -y wrangler@4.151.1 d1 execute "$STAGING_DB_NAME" --remote \
            --config wrangler.staging.toml --json \
            --command "SELECT p.id, m.collection, m.rank, p.tier, p.status FROM prediction_memberships m JOIN picks p ON p.id = m.prediction_id WHERE p.pick_date='${{ inputs.pick_date }}' AND m.collection IN ('top','daily') ORDER BY m.collection, m.rank"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: prediction_cache row for the date
        run: |
          set -euo pipefail
          cd workers
          npx -y wrangler@4.151.1 d1 execute "$STAGING_DB_NAME" --remote \
            --config wrangler.staging.toml --json \
            --command "SELECT cache_key, local_date, timezone, status, cache_version, generated_at FROM prediction_cache WHERE local_date='${{ inputs.pick_date }}'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: sync_state epoch (sanity)
        run: |
          set -euo pipefail
          cd workers
          npx -y wrangler@4.151.1 d1 execute "$STAGING_DB_NAME" --remote \
            --config wrangler.staging.toml --json \
            --command "SELECT * FROM sync_state WHERE id=1"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
