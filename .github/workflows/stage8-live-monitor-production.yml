# WHY: pin the runner/toolchain so unattended runs cannot drift.
# Live match monitoring + settlement for PRODUCTION (SureOdds Cloudflare
# migration, 2026-10-15). Reuses the existing, tested Python engine
# (predbot/jobs/live_results.py + predbot/jobs/live_monitor_d1.py) against
# a D1-synced scratch copy — never a persistent local SQLite database, and
# NEVER sends Telegram messages. Detected match-start/match-end events are
# written to the match_events table (0009_match_events.sql); the
# Cloudflare Worker's own Cron sweep (sweepMatchEvents, workers/src/cron.ts)
# is the only thing that ever delivers them, to the group and the owner
# independently.
#
# EXPLICIT AUTHORIZATION, LOUD FAILURE (same rule as
# stage7-scheduled-production.yml). A dispatched run writes to production D1
# only when the repository variable STAGE8_LIVE_ENABLED is exactly "true".
# "false" = deliberately paused (read-only inspection plus a warning);
# unset/invalid = the run FAILS so the misconfiguration is visible.
#
# A3: no schedule trigger — the Worker's own CRON_DELIVER_SWEEP
# (maybeDispatchLiveMonitor, workers/src/cron.ts) dispatches this on demand
# via workflow_dispatch instead, only when there is real live-tracking work
# to do, instead of this running unconditionally every 5 minutes (288x/day)
# even at night with nothing to track.
name: stage8-live-monitor-production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, no D1 writes (default true)"
        required: false
        default: true
        type: boolean

env:
  PRODUCTION_DB_NAME: sureodds_production

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Its own group, distinct from stage5/stage7/stage9's sureodds-production-sync:
    # sharing one group meant GitHub cancelled whichever run was still pending
    # when the other queued, so a live-monitor tick in progress at generation
    # time would cancel that day's generation outright. The sync_write lease
    # (A2, below) is what keeps D1 writes from overlapping instead.
    concurrency:
      group: sureodds-production-livemon
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: predictions-bot/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install runtime dependency
        run: pip install -r predictions-bot/requirements.txt
      - name: Production target guard (never staging, never a placeholder id)
        run: |
          set -euo pipefail
          grep -q 'database_name = "sureodds_production"' workers/wrangler.toml
          grep -qv 'REPLACE_WITH_STAGING_D1_ID' workers/wrangler.toml || \
            { echo "FAIL workers/wrangler.toml still has the placeholder database_id — run workers/CUTOVER.md step 2 first" >&2; exit 1; }
          ! grep -q 'sureodds_staging' <(grep database_name workers/wrangler.toml)
      - name: Resolve dry-run mode
        id: mode
        run: |
          set -euo pipefail
          v="${STAGE8_LIVE_ENABLED:-}"
          # A3: the dry_run input can arrive as the string "false", "False"
          # (workflow_dispatch's own boolean rendering) or, dispatched via
          # the REST API (the Worker's own on-demand dispatch, B6), the JSON
          # string "false" — normalize case so all of these compare the same.
          dry_run_input="$(printf '%s' "${{ inputs.dry_run }}" | tr '[:upper:]' '[:lower:]')"
          live=false
          if [ "$v" = "true" ] && [ "$dry_run_input" = "false" ]; then
            live=true
          elif [ "$v" != "true" ] && [ "$v" != "false" ] && [ -n "$v" ]; then
            echo "::error::STAGE8_LIVE_ENABLED is '${v}' (must be exactly 'true' or 'false')." >&2; exit 1
          fi
          echo "dry_run=$([ "$live" = "true" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
        env:
          STAGE8_LIVE_ENABLED: ${{ vars.STAGE8_LIVE_ENABLED }}
      - name: Live-run secrets check (skipped in dry-run)
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v:-}" ]; then echo "missing secret: $v" >&2; exit 1; fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Yield to an in-progress generation lease (never race it)
        id: yield
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          cd workers
          n=$(npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "SELECT COUNT(*) AS n FROM job_state WHERE name='generate' AND lease_owner IS NOT NULL AND lease_until > strftime('%Y-%m-%dT%H:%M:%SZ','now')" | python3 scripts/d1_json.py --get 0.results.0.n)
          if [ "$n" != "0" ]; then
            echo "::notice::generation lease is active - yielding this tick instead of racing it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Pull production base (export + load)
        if: steps.yield.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd workers
          # A3: a reduced --table export was investigated (the live monitor's
          # own direct reads/writes trace cleanly to picks, prediction_memberships,
          # posts, prediction_cache, live_fixture_state, ratings, calibration,
          # results_seen, match_events and job_state) — but build_providers()
          # also constructs a Budget(db) for every configured provider
          # (SportsGameOdds here), whose budget/usage tables (api_budget,
          # sgo_usage) are touched only conditionally, depending on which
          # live fixture resolves through which provider on a given run.
          # That conditional path could not be exhaustively proven safe to
          # exclude within this pass, so the export stays full rather than
          # risk a "no such table" failure on a code path this didn't cover.
          npx -y wrangler@4.151.1 d1 export "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --output /tmp/livemon_base.sql
          python3 - <<'EOF'
          import sqlite3, shutil
          con = sqlite3.connect("/tmp/livemon_base.db")
          con.executescript(open("/tmp/livemon_base.sql", encoding="utf-8").read())
          con.commit(); con.close()
          shutil.copyfile("/tmp/livemon_base.db", "/tmp/livemon_scratch.db")
          EOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Run live monitoring + settlement (writes only to the scratch copy)
        if: steps.yield.outputs.skip != 'true'
        run: |
          cd predictions-bot
          python3 -m predbot.jobs.live_monitor_d1 /tmp/livemon_scratch.db
        env:
          # Provider quotas/fallbacks are the existing predbot.config
          # mechanism — never hardcoded here. No live sources configured
          # means this step is a safe no-op (zero provider calls).
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          # Must match workers/wrangler.toml's MATCH_START_WINDOW_MIN: both sides
          # gate the same kickoff window, and a mismatch would re-introduce the
          # dropped-alert bug this value is here to fix.
          MATCH_START_WINDOW_MIN: "45"
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Build scoped plan (settlement + live-tracking tables only)
        if: steps.yield.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 workers/scripts/d1_sync.py plan /tmp/livemon_base.db /tmp/livemon_scratch.db \
            --out /tmp/livemon_plan \
            --tables match_events,picks,live_fixture_state,results_seen,ratings,calibration \
            --write-budget 2000
          cat /tmp/livemon_plan/plan.json
      - name: Acquire the shared D1-write lease (or skip this tick)
        id: lease
        if: steps.mode.outputs.dry_run == 'false' && steps.yield.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd workers
          # A2: serializes against generation AND settlement (stage9), not
          # just 'generate' (the yield check above is specifically about not
          # racing generation while it's mid-run; this lease is the general
          # "nobody else is writing to D1 right now" gate shared by every
          # writer). Unlike generation/settlement (which retry the acquire),
          # the live monitor just skips this tick with a notice — the next
          # dispatch (on-demand, from the Worker) tries again.
          if npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "UPDATE job_state SET lease_owner='gha-${{ github.run_id }}', lease_until=strftime('%Y-%m-%dT%H:%M:%SZ','now','+20 minutes'), attempts=attempts+1, updated_at=strftime('%Y-%m-%dT%H:%M:%SZ','now') WHERE name='sync_write' AND (lease_owner IS NULL OR lease_until IS NULL OR lease_until < strftime('%Y-%m-%dT%H:%M:%SZ','now'))" | python3 scripts/d1_json.py --expect-changes 1; then
            echo "acquired=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::sync_write lease is held by another writer - skipping this tick's apply; the next dispatch retries."
            echo "acquired=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply to production D1 (skipped in dry-run)
        if: steps.mode.outputs.dry_run == 'false' && steps.yield.outputs.skip != 'true' && steps.lease.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          cd workers
          # Re-check the generation lease right before applying: the window
          # between the earlier yield check and this write is long enough
          # for a generation run to have started in between.
          n=$(npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "SELECT COUNT(*) AS n FROM job_state WHERE name='generate' AND lease_owner IS NOT NULL AND lease_until > strftime('%Y-%m-%dT%H:%M:%SZ','now')" | python3 scripts/d1_json.py --get 0.results.0.n)
          if [ "$n" != "0" ]; then
            echo "::notice::generation lease became active since the yield check - skipping apply this tick; the next tick retries."
            exit 0
          fi
          epoch=$(npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "SELECT epoch FROM sync_state WHERE id=1" | python3 scripts/d1_json.py --get 0.results.0.epoch)
          # D1's own API occasionally returns a transient "internal error"
          # (observed: run 39674561403, "internal error; reference =
          # hnimbic4nl6koj3e92g8idkl") with no app-level cause - retrying the
          # same already-planned, idempotent batch file a couple of times
          # clears it. Still a loud exit 1 if all attempts fail - no change
          # to the EXPLICIT AUTHORIZATION / LOUD FAILURE doctrine above.
          apply_batch() {
            local f="$1" base="$2" attempt
            for attempt in 1 2 3; do
              if npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
                --config wrangler.toml --json --file "$f" > "/tmp/livemon_applied_$base.json" 2>&1; then
                if python3 scripts/d1_json.py --assert-success "/tmp/livemon_applied_$base.json"; then
                  return 0
                fi
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::notice::$base attempt $attempt/3 failed, retrying in $((attempt * 5))s"
                sleep "$((attempt * 5))"
              fi
            done
            return 1
          }
          ok=0; total=0
          for f in /tmp/livemon_plan/p0_*.sql /tmp/livemon_plan/p1_*.sql; do
            [ -e "$f" ] || continue
            total=$((total + 1))
            base=$(basename "$f")
            if apply_batch "$f" "$base"; then
              ok=$((ok + 1)); echo "OK $base"
            else
              echo "FAIL $base (after 3 attempts):"; tail -20 "/tmp/livemon_applied_$base.json"; exit 1
            fi
          done
          echo "applied $ok/$total batch files"
          if [ -d /tmp/livemon_plan/rest ] && [ -n "$(ls /tmp/livemon_plan/rest/*.jsonl 2>/dev/null)" ]; then
            DB_ID=$(grep -A2 'database_name = "sureodds_production"' wrangler.toml | grep database_id | sed -E 's/.*"([^"]+)".*/\1/')
            python3 scripts/d1_sync.py rest-apply /tmp/livemon_plan/rest \
              --account-id "$CLOUDFLARE_ACCOUNT_ID" --database-id "$DB_ID" \
              --api-token "$CLOUDFLARE_API_TOKEN"
          fi
          npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "UPDATE sync_state SET epoch=epoch+1, updated_at=strftime('%Y-%m-%dT%H:%M:%SZ','now') WHERE id=1 AND epoch=$epoch" | python3 scripts/d1_json.py --expect-changes 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Release the shared D1-write lease (always, if acquired)
        if: always() && steps.lease.outputs.acquired == 'true'
        run: |
          cd workers
          npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "UPDATE job_state SET lease_owner=NULL, lease_until=NULL WHERE name='sync_write' AND lease_owner='gha-${{ github.run_id }}'" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload sanitized plan (never a full DB dump)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-live-monitor-plan
          if-no-files-found: warn
          path: /tmp/livemon_plan/plan.json
      - name: Check alert dedup state (A6; one alert per incident, not per tick)
        id: dedupcheck
        if: failure()
        run: |
          set -euo pipefail
          cd workers
          # job_state doubles as the dedup store: 'stage8_alert'.last_result
          # tracks whether the PREVIOUS tick already alerted for an
          # ongoing failure. A run that fails right after a success (or on
          # first ever use) is always a NEW incident and always alerts; a
          # run that fails right after another failure is the SAME incident
          # still unresolved and is suppressed, so one outage doesn't spam
          # a Telegram message every 5 minutes. The next SUCCESS resets the
          # state, so the next failure after that is treated as new again.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::no production D1 credentials available to check dedup state - alerting unconditionally"
            echo "repeat=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "INSERT OR IGNORE INTO job_state (name, updated_at) VALUES ('stage8_alert', strftime('%Y-%m-%dT%H:%M:%SZ','now'))" > /dev/null || true
          last=$(npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "SELECT last_result FROM job_state WHERE name='stage8_alert'" \
            | python3 scripts/d1_json.py --get 0.results.0.last_result 2>/dev/null || echo "")
          echo "repeat=$([ "$last" = "failed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "UPDATE job_state SET last_result='failed', updated_at=strftime('%Y-%m-%dT%H:%M:%SZ','now') WHERE name='stage8_alert'" > /dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Alert the owner on failure (actionable only, deduplicated)
        if: failure() && steps.dedupcheck.outputs.repeat != 'true'
        run: |
          set -euo pipefail
          admin_id=$(grep '^TELEGRAM_ADMIN_IDS' workers/wrangler.toml | sed -E 's/.*"([^"]+)".*/\1/' | cut -d',' -f1 | xargs)
          [ -n "$admin_id" ] && [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || { echo "no admin id/token configured for the alert" >&2; exit 0; }
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$admin_id" \
            --data-urlencode text="⚠️ stage8-live-monitor-production failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
      - name: Reset alert dedup state on success
        if: success()
        run: |
          cd workers
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || exit 0
          npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "INSERT OR IGNORE INTO job_state (name, updated_at) VALUES ('stage8_alert', strftime('%Y-%m-%dT%H:%M:%SZ','now'))" > /dev/null || true
          npx -y wrangler@4.151.1 d1 execute "$PRODUCTION_DB_NAME" --remote \
            --config wrangler.toml --json \
            --command "UPDATE job_state SET last_result='ok', updated_at=strftime('%Y-%m-%dT%H:%M:%SZ','now') WHERE name='stage8_alert'" > /dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
