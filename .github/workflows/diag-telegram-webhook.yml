# Read-only production diagnostic: calls Telegram's getWebhookInfo and
# prints it with the bot token masked. No D1 access, no sends, no writes
# of any kind — purely inspects webhook delivery health.
name: diag-telegram-webhook

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: getWebhookInfo (token masked)
        run: |
          set -euo pipefail
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" \
            | python3 -c "
import json, sys
d = json.load(sys.stdin)
r = d.get('result', {})
for k in ('url', 'pending_update_count', 'last_error_date', 'last_error_message', 'last_synchronization_error_date', 'max_connections'):
    if k in r:
        print(f'{k}: {r[k]}')
"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
