# WHY: pin the runner/toolchain so unattended runs cannot drift.
# Automatic daily PRODUCTION generation (09:00 Africa/Lagos).
#
# EXPLICIT AUTHORIZATION, LOUD FAILURE. Live production execution requires the
# repository variable STAGE7_LIVE_ENABLED to be exactly "true". On a SCHEDULED
# fire:
#   "true"            -> live generation
#   "false"           -> deliberately paused: generation is SKIPPED with a
#                        warning annotation (never an offline replay, never
#                        reported as a successful generation)
#   unset / anything  -> this workflow FAILS (red) so the missing or invalid
#   else                 configuration is noticed, and nothing runs
# A scheduled fire can therefore never "succeed" by quietly replaying
# fixtures, and missing configuration can never authorize a live run.
# MANUAL dispatch (workflow_dispatch) is a wiring smoke test: it stays an
# offline, zero-write fixture replay unless the variable is exactly "true".
#
# Telegram is never touched here (allow_telegram_posts stays false): the
# Cloudflare Worker cron posts the stored Top/Daily cards from 09:30.
name: stage7-scheduled-production

on:
  schedule:
    # 08:03 UTC = 09:03 Africa/Lagos (no DST): off GitHub's overloaded top-of-hour
    # slot, where scheduled runs are commonly delayed or dropped.
    - cron: "3 8 * * *"
    # 08:45 UTC = 09:45 Africa/Lagos: backup fire. If 09:03 already landed a
    # COMPLETE cache for today, this is a safe no-op (a non-forced live run is a
    # cache-HIT with zero provider calls and zero new rows — see
    # predbot/cache/fetcher.py _snapshot_locked). It only does real work when
    # 09:03 didn't land.
    - cron: "45 8 * * *"
  workflow_dispatch: {} # manual smoke-test of the scheduling wiring itself; same safe-by-default rule applies

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - id: decide
        run: |
          set -euo pipefail
          v="${STAGE7_LIVE_ENABLED:-}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$v" in
              true) mode=live ;;
              false) mode=paused; echo "::warning::STAGE7_LIVE_ENABLED=false - daily generation is PAUSED; nothing will be generated or posted today." ;;
              *) echo "::error::STAGE7_LIVE_ENABLED is '${v}' (must be exactly 'true' or 'false'). Daily generation did NOT run." >&2; exit 1 ;;
            esac
          else
            if [ "$v" = "true" ]; then mode=live; else mode=offline; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
        env:
          STAGE7_LIVE_ENABLED: ${{ vars.STAGE7_LIVE_ENABLED }}
  scheduled:
    needs: guard
    if: ${{ needs.guard.outputs.mode == 'live' || needs.guard.outputs.mode == 'offline' }}
    uses: ./.github/workflows/stage5-acceptance-production.yml
    with:
      operation: ${{ needs.guard.outputs.mode == 'live' && 'live-generate' || 'fixture-replay' }}
      dry_run: ${{ needs.guard.outputs.mode != 'live' }}
      live_confirm: ${{ needs.guard.outputs.mode == 'live' && 'RUN-LIVE' || '' }}
      allow_telegram_posts: false
      # weekend slates insert ~6.5k+ rows; D1 free tier allows 100k writes/day
      write_budget: "40000"
      destructive_budget: "2000"
    secrets: inherit
