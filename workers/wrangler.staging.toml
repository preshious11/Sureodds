# Staging Worker. NOT production: different D1, different bot token, no
# triggers attached (Cron activation is a Stage-4 approval step).
# No secrets in this file. Required secrets (staging only):
#   wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.staging.toml
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.staging.toml
#   wrangler secret put TELEGRAM_CHAT_ID --config wrangler.staging.toml   (optional)
name = "sureodds-worker-staging"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "sureodds_staging"
database_id = "d1266e71-9a31-4316-9426-e82fedcbf12b"

[vars]
TIMEZONE = "Africa/Lagos"
POST_TIME = "09:00"
DELIVERY_TIME = "09:30"
RECAP_TIME = "07:45"
PAGE_SIZE = "5"
# Public (not a secret, same as production's tg.get_bot_username()):
# the Custom Picks deep-link button (empty-Top card) is omitted entirely
# until this is set, same as production refuses to show a dead link.
# TELEGRAM_BOT_USERNAME = "YourStagingBot"
# STAGE3_CRON_ENABLED is deliberately ABSENT (defaults off). Set to "1" via
# `wrangler secret`... no — via [vars] edit + deploy, only with approval:
# STAGE3_CRON_ENABLED = "1"

# Stage-4 Cron triggers (DO NOT UNCOMMENT without approval — also requires
# STAGE3_CRON_ENABLED = "1" above; both gates must be lifted together).
# These four strings MUST match src/cron.ts's CRON_POST_SWEEP/CRON_RECAP_SWEEP/
# CRON_DELIVER_SWEEP/CRON_WATCH exactly — handleScheduled() dispatches by
# exact string match on the Cron Trigger pattern Cloudflare hands it (plain
# cron syntax carries no descriptive word, so substring matching like
# cron.includes("post") can never work here). POST/RECAP are readiness
# sweeps (fire every 5 min across a window, not once) so a slow or retried
# generation run still gets posted once it's ready, instead of being
# silently skipped for the whole day — postGroupPicks/postGroupRecap's own
# COMPLETE-cache check and post_date receipt make every repeat fire a safe
# no-op before and after the single real send.
# [[triggers.crons]]
# crons = [
#   "*/5 8-22 * * *",  # post sweep: Top+Daily to the group, 09:00-23:55 Lagos
#   "*/5 6-7 * * *",   # recap sweep: yesterday's results to the group, 07:00-08:55 Lagos
#   "*/5 * * * *",     # deliver: webhook-retry observability (no provider/Telegram calls)
#   "0 10 * * *",      # watch: log MISSED generation if no COMPLETE cache by 11:00 Lagos
# ]
