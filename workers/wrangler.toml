# Production activation (2026-10-15): the Telegram webhook points here and
# the Worker's own Cron now owns posting/delivery. Justrunmyapp is retired.
name = "sureodds-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# D1 binding. Create once (staging): `wrangler d1 create sureodds_staging`.
# Production D1 is NOT created in Stage 1.
[[d1_databases]]
binding = "DB"
database_name = "sureodds_production"
database_id = "db428f31-713c-401c-8c6f-07ce839f5950"

[vars]
TIMEZONE = "Africa/Lagos"
POST_TIME = "09:00"
DELIVERY_TIME = "09:30"
RECAP_TIME = "07:45"
# WHY: set this to the deploy date after migration 0012; empty disables result GIFs.
RESULT_GIFS_START_DATE = "2026-10-18"
# Latest the recap may wait for the week's settlement before posting anyway (never skipped entirely). Must stay inside the Sunday CRON_RECAP_SWEEP window (07:00-08:55 Lagos).
RECAP_DEADLINE = "08:45"
# Retained for event recording/reconciliation; match-start/end events are not delivered to Telegram.
MATCH_START_WINDOW_MIN = "45"
# Retained for event recording/reconciliation; match-end events are not delivered to Telegram.
MATCH_END_WINDOW_HOURS = "24"
# Minutes between the Worker's own on-demand dispatches of stage8-live-monitor-production.yml
# (CRON_DELIVER_SWEEP decides whether there is any work before dispatching at all).
LIVE_MONITOR_INTERVAL_MIN = "10"
# WHY: bound self-healing retries to protect provider quotas.
GENERATION_MAX_DISPATCHES_PER_DAY = "5"
# "owner/repo" for the stage8 workflow_dispatch call.
GITHUB_REPO = "preshious11/Sureodds"
# Ref (branch) stage8 is dispatched against. Defaults to "main" in code if unset here.
GITHUB_REF = "main"
PAGE_SIZE = "5"
# Public (not a secret): the Custom Picks deep-link button (empty-Top card)
# is omitted entirely until this is set — never a dead link.
# TELEGRAM_BOT_USERNAME = "BETTSUREbot"
TELEGRAM_BOT_USERNAME = "BETTSUREbot"
TELEGRAM_ADMIN_IDS = "8606823551"
# Disabled 2026-10-29: this Worker is a passive rollback target post-cutover
# (see CUTOVER.md's own rollback section, which already treats this exact
# flag as the on/off switch, independent of webhook/rollback readiness) -
# it has no up-to-date view of generation/settlement/picks any more since
# write_target moved those writes to the server, not D1. Left firing, its
# own cron.ts handlers (same code the server now runs) were producing
# false "no COMPLETE cache"/stale pending-count alerts against an
# increasingly stale D1. Re-enable only as part of an actual rollback.
STAGE3_CRON_ENABLED = "0"
# Pro Picks evidence-aware policy rollout flag (pro_policy.ts). Hard default
# everywhere except "evidence_v2" is legacy (byte-identical pre-existing
# behavior) - see pro_policy.ts's own header comment for the rollback
# guarantee. Rollback: set back to "legacy" (or delete this line) and redeploy.
PRO_POLICY_MODE = "evidence_v2"
# Combined-odds eligibility band the automatic group post re-checks at publish
# time, independent of selection. Must track predbot/config.py's
# top_odds_target/max and daily_odds_min/max - drifting out of sync here
# silently skips posting an otherwise-COMPLETE ticket (2026-11-12 incident).
# This Worker is the passive rollback target (see STAGE3_CRON_ENABLED above);
# the live values the server actually posts with come from
# /opt/sureodds/workers/bot/.env, not this file - kept here only so a
# rollback doesn't resurrect the stale 10/12 band.
TOP_COMBINED_ODDS = "2"
TOP_ODDS_MAX = "2.5"
DAILY_COMBINED_MIN_ODDS = "5"
DAILY_COMBINED_MAX_ODDS = "7"

# Matches workers/src/cron.ts's exported CRON_POST_SWEEP / CRON_RECAP_SWEEP /
# CRON_DELIVER_SWEEP / CRON_WATCH exactly — handleScheduled dispatches on
# exact string equality, never a substring, so these four strings must stay
# byte-identical to those constants.
[triggers]
crons = ["*/5 8-22 * * *", "*/5 6-7 * * 0", "*/5 * * * *", "0 10 * * *"]

# Secrets (never in this file):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put TELEGRAM_CHAT_ID   (optional, community destination)
#   wrangler secret put GITHUB_DISPATCH_TOKEN   (optional: fine-grained PAT, "Actions: Read and write"
#                                                 on this repo only — enables on-demand live-monitor dispatch)
#
# Local dev: copy .dev.vars.example to .dev.vars (gitignored).
